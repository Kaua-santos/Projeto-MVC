<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <h1>Entrar no sistema </h1>

    <form action="/auth/login" method="post">

        <!-- exibe confirmação apos cadastro feito -->
         {% if request.query.get("cadastro") == "ok" %}
         <p style="color: green;">cadastro realizado com sucesso! Faça login.</p>
        {% endif %}

        Nome: <input type="text" name="nome">
        <br><br>
        E-mail: <input type="text" name="email" required>
        <br><br>
        Senha: <input type="password" name="senha" minlength="4">
        <br><br>
       
    
    {% if erro %}
    <p style="color: red;">{{erro}}</p>
    {% endif %}
 <button type="submit">Entrar</button>
</form>

<p>Ja tem conta ? <a href="/auth/cadastro">Cadastre-se</a></p>

</body>
</html>
