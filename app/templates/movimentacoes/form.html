<!-- templates/movimentacoes/form.html -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova Movimentação — AAPM SENAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0f; --surface: #111118; --border: #1e1e2e;
      --accent: #7c6dfa; --accent2: #4fd1b5;
      --text: #f0eeff; --muted: #7a7a9a; --card-bg: #13131c;
      --danger: #f87171; --green: #4ade80;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    body::before {
      content: ''; position: fixed; inset: 0;
      background-image: linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 40px 40px; opacity: 0.25; pointer-events: none; z-index: 0;
    }
    .blob { position: fixed; border-radius: 50%; filter: blur(110px); opacity: 0.08; pointer-events: none; z-index: 0; }
    .blob-1 { width: 450px; height: 450px; background: var(--accent); top: -120px; right: -80px; }
    .blob-2 { width: 300px; height: 300px; background: var(--accent2); bottom: -60px; left: -60px; }

    nav {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 1rem 2.5rem;
      background: rgba(10,10,15,0.88); backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }
    .nav-logo {
      font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1rem;
      color: var(--text); text-decoration: none; display: flex; align-items: center; gap: 8px;
    }
    .nav-logo .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }

    main { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding: 3.5rem 2rem 5rem; }

    .page-header { margin-bottom: 2rem; opacity: 0; animation: fadeUp 0.5s ease 0.1s forwards; }
    .page-header h1 { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.9rem; letter-spacing: -0.04em; }

    .alert-error {
      display: flex; align-items: center; gap: 8px; font-size: 0.875rem;
      padding: 0.75rem 1.1rem; border-radius: 8px; margin-bottom: 1.25rem;
      background: rgba(248,113,113,0.08); border: 1px solid rgba(248,113,113,0.22); color: var(--danger);
      opacity: 0; animation: fadeUp 0.4s ease 0.15s forwards;
    }

    .card {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 16px; padding: 2rem;
      opacity: 0; animation: fadeUp 0.6s ease 0.2s forwards;
    }

    .field { margin-bottom: 1.25rem; }
    .field label { display: block; font-size: 0.75rem; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.45rem; }
    .field input, .field select, .field textarea {
      width: 100%; font-family: 'DM Sans', sans-serif; font-size: 0.9rem; color: var(--text);
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 0.65rem 0.9rem; outline: none;
      transition: border-color 0.2s; appearance: none;
    }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
    .field input::placeholder, .field textarea::placeholder { color: var(--muted); }

    /* info pill abaixo do select de produto */
    .info-pill {
      display: none; align-items: center; gap: 6px; margin-top: 0.5rem;
      font-size: 0.8rem; color: var(--muted);
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; padding: 0.3rem 0.85rem; width: fit-content;
    }
    .info-pill.visible { display: flex; }
    .info-pill strong { color: var(--text); }

    /* subtotal destaque */
    .subtotal-box {
      display: none; align-items: center; justify-content: space-between;
      background: rgba(124,109,250,0.07); border: 1px solid rgba(124,109,250,0.2);
      border-radius: 10px; padding: 0.75rem 1rem; margin-bottom: 1.25rem;
    }
    .subtotal-box.visible { display: flex; }
    .subtotal-box .label { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }
    .subtotal-box .valor { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1.1rem; color: var(--accent); }

    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

    .actions { display: flex; gap: 0.75rem; margin-top: 1.75rem; padding-top: 1.5rem; border-top: 1px solid var(--border); }
    .btn-primary {
      font-family: 'DM Sans', sans-serif; font-size: 0.9rem; font-weight: 500;
      color: #fff; background: var(--accent); border: none; border-radius: 8px;
      padding: 0.65rem 1.5rem; cursor: pointer; transition: opacity 0.2s, transform 0.2s;
    }
    .btn-primary:hover { opacity: 0.85; transform: translateY(-2px); }
    .btn-ghost {
      font-family: 'DM Sans', sans-serif; font-size: 0.9rem; color: var(--muted);
      background: transparent; border: 1px solid var(--border); border-radius: 8px;
      padding: 0.65rem 1.25rem; text-decoration: none; transition: color 0.2s, border-color 0.2s;
    }
    .btn-ghost:hover { color: var(--text); border-color: #3a3a5a; }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 520px) { .row-2 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>

<nav>
  <a href="/" class="nav-logo"><span class="dot"></span>AAPM SENAI</a>
</nav>

<main>
  <div class="page-header">
    <h1>Registrar movimentação</h1>
  </div>

  {% if erro %}
    <div class="alert-error">✕ {{ erro }}</div>
  {% endif %}

  <div class="card">
    <form action="/movimentacoes/nova" method="post">

      <div class="field">
        <label for="select-produto">Produto</label>
        <select name="produto_id" required id="select-produto">
          <option value="">Selecione...</option>
          {% for p in produtos %}
            <option value="{{ p.id }}"
                    data-estoque="{{ p.estoque_atual }}"
                    data-preco="{{ p.preco }}"
                {{ 'selected' if produto_id == p.id else '' }}>
              {{ p.nome }} — estoque: {{ p.estoque_atual }}
            </option>
          {% endfor %}
        </select>
        <!--
          Exibe o estoque atual do produto selecionado
          para o usuário não precisar adivinhar o saldo.
        -->
        <div class="info-pill" id="info-estoque">
          📦 Estoque atual: <strong id="valor-estoque">0</strong>
        </div>
      </div>

      <div class="field">
        <label for="select-tipo">Tipo</label>
        <select name="tipo" required id="select-tipo">
          <option value="">Selecione...</option>
          {% for t in tipos %}
            <option value="{{ t.value }}">
              {{ "▲ Entrada" if t.value == 'entrada' else "▼ Saída" }}
            </option>
          {% endfor %}
        </select>
      </div>

      <div class="row-2">
        <div class="field">
          <label for="input-quantidade">Quantidade</label>
          <input type="number" name="quantidade" min="1" required id="input-quantidade" placeholder="0" />
        </div>
        <div class="field">
          <label for="input-preco">Preço unitário (R$)</label>
          <input type="number" name="preco_unitario" step="0.01" min="0" required id="input-preco" placeholder="0,00" />
        </div>
      </div>

      <!-- Subtotal calculado em tempo real via JS -->
      <div class="subtotal-box" id="info-subtotal">
        <span class="label">Subtotal</span>
        <span class="valor" id="valor-subtotal">R$ 0,00</span>
      </div>

      <div class="field">
        <label for="observacao">Observação (opcional)</label>
        <input type="text" name="observacao" id="observacao" maxlength="255"
               placeholder="Ex: Compra fornecedor X, Venda balcão..." />
      </div>

      <div class="actions">
        <button type="submit" class="btn-primary">Registrar</button>
        <a href="/movimentacoes" class="btn-ghost">Cancelar</a>
      </div>

    </form>
  </div>
</main>

<script>
  const selectProduto   = document.getElementById('select-produto');
  const inputQuantidade = document.getElementById('input-quantidade');
  const inputPreco      = document.getElementById('input-preco');
  const infoEstoque     = document.getElementById('info-estoque');
  const valorEstoque    = document.getElementById('valor-estoque');
  const infoSubtotal    = document.getElementById('info-subtotal');
  const valorSubtotal   = document.getElementById('valor-subtotal');

  selectProduto.addEventListener('change', function () {
    const option = this.options[this.selectedIndex];
    const estoque = option.dataset.estoque;
    const preco   = option.dataset.preco;

    if (estoque !== undefined) {
      valorEstoque.textContent = estoque;
      infoEstoque.classList.add('visible');
      inputPreco.value = parseFloat(preco).toFixed(2);
    } else {
      infoEstoque.classList.remove('visible');
    }
    atualizarSubtotal();
  });

  function atualizarSubtotal() {
    const qtd   = parseFloat(inputQuantidade.value) || 0;
    const preco = parseFloat(inputPreco.value) || 0;
    const total = qtd * preco;
    if (qtd > 0 && preco > 0) {
      valorSubtotal.textContent = total.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
      infoSubtotal.classList.add('visible');
    } else {
      infoSubtotal.classList.remove('visible');
    }
  }

  inputQuantidade.addEventListener('input', atualizarSubtotal);
  inputPreco.addEventListener('input', atualizarSubtotal);
</script>
</body>
</html>
